<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | Ruta Tica Rent a Car</title>

    <link rel="stylesheet" href="../../public/css/diseno.css">

    <style>
        .restablecer-container {
            max-width: 450px;
            margin: 55px auto;
            padding: 35px;
            background: var(--color-blanco);
            border-radius: var(--borde-redondeado);
            box-shadow: var(--sombra-suave);
        }

        .restablecer-container h2 {
            text-align: center;
            color: var(--color-marca);
            margin-top: 0;
        }

        .restablecer-container p {
            text-align: center;
            color: var(--color-texto-suave);
            line-height: 1.6;
        }

        .restablecer-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .restablecer-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: var(--color-marca);
        }

        .restablecer-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            font-size: 15px;
        }

        .restablecer-form input:focus {
            outline: none;
            border-color: var(--color-secundario);
        }

        .restablecer-form button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
        }

        .restablecer-links {
            margin-top: 22px;
            text-align: center;
        }

        .restablecer-links a {
            color: var(--color-secundario);
            font-weight: bold;
            text-decoration: none;
        }

        .restablecer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .restablecer-container {
                margin: 25px auto;
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header class="site-header">
            <div class="container-inner">
                <h1 class="logo">Ruta Tica Rent a Car</h1>

                <nav class="main-nav">
                    <ul>
                        <li><a href="../../inicio.html">Inicio</a></li>
                        <li><a href="../../catalogo.html">Catálogo de Vehículos</a></li>
                        <li><a href="../../reservacion.html">Reservación</a></li>
                        <li><a href="login.html" class="btn btn-sesion">Iniciar Sesión</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="contenido">

            <section class="restablecer-container">

                <h2>Nueva contraseña</h2>

                <p>
                    Ingresa tu nueva contraseña y confírmala
                    para recuperar el acceso a tu cuenta.
                </p>

                <form class="restablecer-form" action="#" method="POST">

                    <div>
                        <label for="contrasena">Nueva contraseña</label>

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresa tu nueva contraseña"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div>
                        <label for="confirmar_contrasena">
                            Confirmar nueva contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmar_contrasena"
                            name="confirmar_contrasena"
                            placeholder="Repite tu nueva contraseña"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit">
                        Guardar nueva contraseña
                    </button>

                </form>

                <div class="restablecer-links">
                    <a href="login.html">Volver al inicio de sesión</a>
                </div>

            </section>

        </main>

        <footer class="site-footer">
            <div class="container-inner">
                <p>© 2026 Ruta Tica</p>
            </div>
        </footer>

    </div>
</body>
</html>
